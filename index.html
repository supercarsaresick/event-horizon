<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Event Horizon</title><link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png"><link rel="icon" type="image/png" sizes="128x128" href="assets/icon.png"><link rel="shortcut icon" href="assets/favicon-32.png"><link rel="apple-touch-icon" href="assets/icon.png"><link rel="stylesheet" href="style.css"></head><body>
<div class="backdrop"></div><div class="shell" data-page="home"><aside class="sidebar"><div class="brand"><span class="orb"></span><div>EVENT HORIZON</div></div><nav id="nav"><button data-view="home" class="active"><span>⌂</span> Home</button><button data-view="overview"><span>◉</span> Overview</button><button data-view="execution"><span>▤</span> Execution</button><button data-view="goals"><span>◎</span> Goals</button><button data-view="knowledge"><span>▧</span> Research</button><button data-view="browser"><span>▣</span> Browser</button><button data-view="tools"><span>◇</span> Instruments</button><button data-view="settings"><span>⚙</span> Settings</button></nav><div class="side-bottom"><button id="commandBtn" class="command-btn"><span>Commands</span> <kbd>Ctrl K</kbd></button><div class="status"><i id="netDot"></i><span id="netLabel">Checking network</span></div></div></aside>
<main><header><div><h1 id="heading">Home</h1></div><div class="header-right"><span id="dayLabel"></span><span class="pill" id="saveStatus">LOCAL STORAGE</span><button class="iconbtn" id="wallpaperBtn" title="Toggle clean wallpaper">◐</button></div></header><div id="view"></div><footer>EVENT HORIZON <span>•</span> v1.10</footer></main></div>
<div id="clean" hidden><button id="exitClean">Return · Esc</button><div id="cleanClock"></div></div>
<dialog id="palette"><div class="dialoghead"><span>COMMAND PALETTE</span><button data-close="palette" class="iconbtn">×</button></div><input id="commandInput" placeholder="Search commands, tasks, notes, goals or URLs…" autocomplete="off"><div id="commandResults"></div><div class="hint">↑ ↓ navigate · Enter execute · Esc close</div></dialog>
<dialog id="editor"><div class="dialoghead"><span id="editorTitle"></span><button data-close="editor" class="iconbtn">×</button></div><form id="editorForm"><div id="editorFields"></div><div class="actions"><button type="button" data-close="editor">Cancel</button><button class="primary" type="submit">Save</button></div></form></dialog>
<div id="toast" role="status"></div><script src="app.js"></script></body></html>
